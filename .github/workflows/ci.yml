name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-tcp:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Checkout core conformance harness
        uses: actions/checkout@v4
        with:
          repository: puffball1567/koutendb
          # Core PR #136: v0.14.3 runtime plus the shared conformance harness.
          ref: e36b424bcfd9cd0dfa24ae121f4b4dd028b0eaac
          path: koutendb-core
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, sodium, :ffi
          tools: composer
          coverage: none
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - name: Install core dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsodium-dev
          cd koutendb-core
          nimble install -y --depsOnly
      - name: Install without FFI and validate public types
        run: |
          php -r 'if (class_exists("FFI")) { exit(1); }'
          composer validate --strict
          composer install --no-interaction --no-dev
          php tests/tcp_unit.php
      - name: Native wire conformance
        run: |
          cd koutendb-core
          bash scripts/native_driver_conformance.sh php ../tests/tcp_adapter.php

  test:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout PHP driver
        uses: actions/checkout@v4

      - name: Checkout KoutenDB core
        uses: actions/checkout@v4
        with:
          repository: puffball1567/koutendb
          ref: v0.14.3
          path: koutendb-core

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"

      - name: Install PHP with FFI
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=true
          tools: composer
          coverage: none

      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: Build KoutenDB C ABI
        run: |
          cd koutendb-core
          nimble install -y --depsOnly
          bash scripts/build_capi.sh

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Lint PHP files
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find src tests examples -name '*.php' -print0)

      - name: Existing FFI regression tests
        env:
          KOUTENDB_LIB_PATH: ${{ github.workspace }}/koutendb-core/lib/libkoutendb.so
        run: |
          php -d ffi.enable=1 tests/driver_test.php
          php -d ffi.enable=1 examples/embedded.php
